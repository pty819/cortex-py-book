name: Deploy Sphinx Book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install mermaid-cli
        run: npm install @mermaid-js/mermaid-cli

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Create mmdc wrapper with --no-sandbox
        run: |
          cat > mmdc-wrapper.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$SCRIPT_DIR/node_modules/.bin/mmdc" \
            --puppeteerConfigFile "$SCRIPT_DIR/puppeteer-config.json" \
            "$@"
          EOF
          chmod +x mmdc-wrapper.sh
          cat > puppeteer-config.json << 'EOF'
          {"args": ["--no-sandbox", "--disable-setuid-sandbox", "--font-render-hinting=none"]}
          EOF
          # Update conf.py paths for CI environment
          sed -i "s|mermaid_cmd = '.*'|mermaid_cmd = '$(pwd)/mmdc-wrapper.sh'|" source/conf.py
          sed -i "s|mermaid_params = \['--configFile', '.*'\]|mermaid_params = ['--configFile', '$(pwd)/mermaid-config.json']|" source/conf.py

      - name: Install Python dependencies
        run: uv sync

      - name: Build Sphinx HTML
        run: uv run sphinx-build -b html source build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/html
          publish_branch: gh-pages
          force_orphan: true
